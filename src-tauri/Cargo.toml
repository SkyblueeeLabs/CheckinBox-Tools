[package]
name = "checkinbox"
version = "0.1.0"
description = "聚合 AI 编程工具每日签到"
authors = ["Skyblueee"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "checkinbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 可执行文件名（窗口标题/托盘/安装包同名）
[[bin]]
name = "CheckinBox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "default-tls",
] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
sha2 = "0.10"
# Electron safeStorage（OSCrypt v10）加解密：Qoder 客户端登录态 auth.v1.dat
aes-gcm = "0.10"
# 读 App Paths 注册表定位客户端 exe（W 版 API，中文路径无编码问题）
winreg = "0.55"
# 读 WorkBuddy（CodeBuddy）的 state.vscdb（SQLite）里的 safeStorage 凭据
rusqlite = { version = "0.31", features = ["bundled"] }
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dirs = "6"
open = "5"

[features]
# 生产构建必带：启用后 `generate_context!` 才会把 ../dist 的界面嵌入 exe；
# 不带的话 exe 会去连 devUrl（http://localhost:5173）的开发服务器，
# 没开 `npm run dev` 就会显示「localhost 拒绝连接」。
# ⚠️ tauri-cli 2.12+ 不再自动带这个特性（实测 2.12.4），命令要显式写：
#   npx tauri build --no-bundle --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
