name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Read version and generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package.json v${VERSION}" >&2
            exit 1
          fi
          node scripts/release-notes.mjs --version "${VERSION}" --output latest-notes.md
          {
            echo "version=${VERSION}"
            echo "body<<EOF"
            cat latest-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "CheckinBox ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ${{ steps.release_notes.outputs.body }}

            ---
            Windows 安装包与免安装版见下方 Assets。
            - `*_x64-setup.exe`：推荐；自动更新只支持 NSIS 安装版
            - `*_portable.exe`：免安装；便携版不自动安装更新
            - `*_x64_zh-CN.msi`：企业部署

            安装包未做代码签名，首次运行可能提示「未知发布者」：点「更多信息 → 仍要运行」即可。
          releaseDraft: true
          prerelease: false
          args: --features custom-protocol

      - name: Upload portable exe and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PORTABLE="CheckinBox_${TAG#v}_portable.exe"
          cp src-tauri/target/release/CheckinBox.exe "$PORTABLE"
          {
            sha256sum "$PORTABLE"
            (cd src-tauri/target/release/bundle/nsis && sha256sum *.exe)
            (cd src-tauri/target/release/bundle/msi && sha256sum *.msi)
          } > SHA256SUMS.txt
          gh release upload "$TAG" "$PORTABLE" SHA256SUMS.txt --clobber

      - name: Build and upload updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.release_notes.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-update-manifest.mjs \
            --version "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --assets-dir "src-tauri/target/release/bundle/nsis" \
            --notes-file "latest-notes.md" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "latest.json"
          sha256sum latest.json >> SHA256SUMS.txt
          gh release upload "$TAG" latest.json SHA256SUMS.txt --clobber
